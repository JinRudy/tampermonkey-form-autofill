<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Autofill Recorder Test Page</title>
    <style>
      body {
        margin: 0;
        background: #f3f4f6;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(920px, calc(100vw - 32px));
        margin: 32px auto;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 24px;
      }
      .forms {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      form {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        padding: 18px;
      }
      label,
      .field {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"],
      textarea,
      select {
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
      }
      textarea {
        min-height: 88px;
      }
      .inline {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button {
        margin-top: 16px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        padding: 8px 12px;
      }
      @media (max-width: 760px) {
        .forms {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>表单自动填写测试页</h1>
      <div class="forms">
        <form id="customer-form" name="customerForm">
          <h2>客户资料</h2>
          <input type="hidden" name="csrfToken" value="token-should-not-be-saved">
          <label>
            姓名
            <input id="customerName" type="text" name="customerName" placeholder="张三">
          </label>
          <label>
            邮箱
            <input id="customerEmail" type="email" name="customerEmail" placeholder="demo@example.com">
          </label>
          <label>
            密码（默认不保存）
            <input id="customerPassword" type="password" name="customerPassword">
          </label>
          <label>
            备注
            <textarea id="customerNote" name="customerNote"></textarea>
          </label>
          <button type="button">模拟提交</button>
        </form>

        <form id="preference-form" name="preferenceForm">
          <h2>偏好设置</h2>
          <label>
            客户级别
            <select id="customerLevel" name="customerLevel">
              <option value="">请选择</option>
              <option value="normal">普通</option>
              <option value="vip">VIP</option>
              <option value="enterprise">企业</option>
            </select>
          </label>
          <div class="field">
            <span>联系时间</span>
            <label class="inline"><input id="timeMorning" type="radio" name="contactTime" value="morning"> 上午</label>
            <label class="inline"><input id="timeAfternoon" type="radio" name="contactTime" value="afternoon"> 下午</label>
          </div>
          <label class="inline">
            <input id="allowMarketing" type="checkbox" name="allowMarketing" value="yes">
            允许营销触达
          </label>
          <label>
            禁用字段（默认不保存）
            <input id="disabledField" type="text" name="disabledField" value="disabled-value" disabled>
          </label>
          <button type="button">模拟提交</button>
        </form>
      </div>
    </main>
  </body>
</html>
